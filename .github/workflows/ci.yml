name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      # examples/observer only needs to *compile* here — actually running it
      # needs the real `claude` CLI, which CI intentionally doesn't install.
      # session_test.go's Session/NewSession/Send tests don't need it either:
      # they re-exec this same test binary as a fake CLI (see its TestMain),
      # so the actual subprocess/stream-json protocol layer is still
      # genuinely exercised in CI, just against a stand-in process.
      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Format check
        run: |
          diff="$(gofmt -l .)"
          if [ -n "$diff" ]; then
            echo "gofmt found unformatted files:"
            echo "$diff"
            exit 1
          fi

      - name: Test
        run: go test ./... -race -v
